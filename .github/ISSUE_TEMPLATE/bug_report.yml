name: "🐛 Bug Report"
description: "Report a bug or reproducible issue in DERA"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure that you do **not** include production passwords, database connection strings, or sensitive customer data.

  - type: textarea
    id: description
    attributes:
      label: "Problem Description"
      description: "A clear and concise description of the bug."
      placeholder: "Describe what happened..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Connect to PostgreSQL database with...
        2. Execute schema inspection...
        3. Encounter error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "Expected schema extraction to succeed with..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened instead?"
      placeholder: "Extraction failed with..."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment Details"
      description: "Operating System, DERA Version, Database Engine & Version (e.g., PostgreSQL 16.2), Python Version."
      placeholder: "Ubuntu 22.04, DERA main @ commit, PostgreSQL 16.2, Python 3.12"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Sanitized Logs or Error Output"
      description: "Paste error messages or logs here. Please redact all connection secrets and customer record data."
      render: shell

  - type: checkboxes
    id: safety_check
    attributes:
      label: "Security & Safety Check"
      options:
        - label: "I confirm that no secrets, database passwords, or sensitive customer records are included in this report."
          required: true
