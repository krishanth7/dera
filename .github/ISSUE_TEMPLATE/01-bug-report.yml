name: "🐛 Bug Report"
description: "Report a reproducible bug, calculation discrepancy, or error in DERA."
title: "[Bug]: "
labels: ["type/bug", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for reporting an issue!
        Before proceeding:
        - If you believe you have discovered a **security vulnerability**, please disclose it privately via [GitHub Security Advisories](https://github.com/krishanth7/dera/security/advisories/new) or email `krishanth.b.2008@gmail.com`.
        - Please verify that this issue has not already been reported in [GitHub Issues](https://github.com/krishanth7/dera/issues).
        - **Never include database passwords, API tokens, connection secrets, or confidential table data in this report.**

  - type: input
    id: version
    attributes:
      label: "DERA Version or Commit SHA"
      description: "Specify the version or git commit hash you are running (e.g., `0.1.0-dev`, `main @ 810d6e3`)."
      placeholder: "e.g., main @ commit hash or 0.1.0-dev"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: "Affected Component"
      description: "Select the architectural component where the issue occurred."
      options:
        - "Core Engine (packages/core)"
        - "Database Connectors (packages/connectors)"
        - "Shared Contracts (packages/contracts)"
        - "Backend API (apps/api)"
        - "Web Application (apps/web)"
        - "Documentation (docs/)"
        - "Developer CLI & Scripts (scripts/)"
        - "CI/CD & Workflows (.github/)"
        - "Other"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment Details"
      description: "Operating system, architecture, and runtime versions."
      placeholder: "e.g., Ubuntu 24.04 LTS / Windows 11, Python 3.13.0, Node.js v22.11.0"
    validations:
      required: true

  - type: input
    id: database
    attributes:
      label: "Target Database Engine & Version (if applicable)"
      description: "If the issue relates to database inspection, specify the engine and version."
      placeholder: "e.g., PostgreSQL 16.4, SQLite 3.45.1, Supabase Local"

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Provide clear, step-by-step instructions to reproduce the problem."
      placeholder: |
        1. Connect to SQLite database with schema containing composite foreign keys...
        2. Run schema introspection via CLI...
        3. Observe error output...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A concise explanation of what you expected to happen."
      placeholder: "Expected introspection to succeed and construct DAG with 12 nodes..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened instead (including unexpected output or failure mode)."
      placeholder: "Inspection threw KeyError on composite foreign key reference..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Sanitized Logs or Terminal Output"
      description: "Paste sanitized error tracebacks or command output. Redact all connection strings and passwords."
      render: shell

  - type: checkboxes
    id: safety_confirmation
    attributes:
      label: "Security & Confidentiality Confirmation"
      options:
        - label: "I confirm that I have removed all connection credentials, passwords, tokens, and proprietary table-row data from this report."
          required: true
        - label: "I have searched existing issues and verified this is not a duplicate."
          required: true
