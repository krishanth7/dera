name: "✨ Feature Request"
description: "Suggest a new capability, connector, or diagnostic rule for DERA"
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a feature! **Important:** DERA follows a strict non-AI engineering philosophy. We do not accept proposals requiring generative AI models, LLMs, or external inference APIs.

  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: "What challenge or engineering limitation does this feature address?"
      placeholder: "I am unable to inspect composite foreign keys when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the functionality or engineering approach you would like to see implemented."
      placeholder: "Add deterministic support in the canonical schema normalizer to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or workarounds you have evaluated."
      placeholder: "Exporting raw catalogs manually via..."

  - type: textarea
    id: impact
    attributes:
      label: "Compatibility & Scope"
      description: "Which database engines, frontend views, or architectural layers are impacted?"
      placeholder: "Applies to PostgreSQL and MySQL connectors..."

  - type: checkboxes
    id: non_ai_check
    attributes:
      label: "Architectural Principles Confirmation"
      options:
        - label: "I confirm this proposal relies on deterministic database engineering (no generative AI, LLMs, or inference APIs)."
          required: true
