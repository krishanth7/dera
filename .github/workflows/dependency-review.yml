# ============================================================
# DERA — Database Engineering & Reverse Analysis
# Dependency & Supply Chain Security Review
#
# Purpose:
#   Scans pull requests for known vulnerabilities and license risks
#   in newly added or upgraded dependencies.
# ============================================================

name: "DERA | Dependency Review"

on:
  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - "packages/**/package.json"
      - "apps/**/package.json"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dep-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: "Vulnerability & License Review"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Scan PR Dependencies"
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: "MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Python-2.0, 0BSD"
