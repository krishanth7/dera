# ============================================================
# DERA — Database Engineering & Reverse Analysis
# Multilingual Documentation & Navigation (10 Languages)
#
# Purpose:
#   Validates canonical language manifest, navigation generator
#   synchronization, managed markers, and cross-navigation parity.
# ============================================================

name: "DERA | Multilingual Validation"

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/README.md"
      - "docs/i18n/**"
      - "scripts/docs/**"
      - "scripts/ci/validate_i18n.py"
      - "tests/docs/test_language_navigation.py"
      - "tests/docs/test_i18n_parity.py"
      - ".github/workflows/i18n.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "README.md"
      - "docs/README.md"
      - "docs/i18n/**"
      - "scripts/docs/**"
      - "scripts/ci/validate_i18n.py"
      - "tests/docs/test_language_navigation.py"
      - "tests/docs/test_i18n_parity.py"
      - ".github/workflows/i18n.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-i18n:
    name: "10-Language Parity & Navigation Verification"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: "Verify Navigation Synchronization"
        run: |
          python scripts/docs/generate_language_navigation.py --check

      - name: "Validate i18n Suite & Translation Parity"
        run: |
          python scripts/ci/validate_i18n.py

      - name: "Run Multilingual & Parity Regression Tests"
        run: |
          python -m unittest tests/docs/test_language_navigation.py tests/docs/test_i18n_parity.py

