# ============================================================
# DERA — Database Engineering & Reverse Analysis
# Container Build Validation
#
# Purpose:
#   Validates Dockerfile syntax, non-root user execution,
#   and multi-stage image build without pushing on untrusted PRs.
# ============================================================

name: "DERA | Docker Validation"

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: "Dockerfile Syntax & Build Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: "Build Container Image (Dry Run)"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: dera-api:test

      - name: "Validate Non-Root User"
        run: |
          docker run --rm --entrypoint id dera-api:test -u | grep -q "10001"
          echo "Verified: Container runs as non-root UID 10001."
