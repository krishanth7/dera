# ============================================================
# DERA — Database Engineering & Reverse Analysis
# Documentation Quality Gate & Linting
#
# Purpose:
#   Validates Markdown formatting, internal link and heading anchor
#   integrity, Mermaid diagram syntax, 10-language navigation parity,
#   documentation structure, and regression test suites.
#
# Principles:
#   - Least-privilege permissions (contents: read)
#   - Fast deterministic execution (< 1 minute)
#   - Fully offline / hermetic (no external network dependencies)
#   - Concurrency cancellation for superseded PR runs
# ============================================================

name: "DERA | Documentation Validation"

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "*.md"
      - ".markdownlint-cli2.jsonc"
      - "scripts/ci/validate_docs.py"
      - "scripts/ci/validate_mermaid.py"
      - "tests/docs/test_doc_validation.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/documentation.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "docs/**"
      - "*.md"
      - ".markdownlint-cli2.jsonc"
      - "scripts/ci/validate_docs.py"
      - "scripts/ci/validate_mermaid.py"
      - "tests/docs/test_doc_validation.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: "Documentation Quality Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up Node.js LTS"
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: "Install Node Dependencies"
        run: |
          npm ci --ignore-scripts || npm install --no-audit --ignore-scripts

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: "1. Markdown Linting"
        run: |
          npm run docs:lint

      - name: "2. Internal Link, Anchor & Structure Validation"
        run: |
          python scripts/ci/validate_docs.py

      - name: "3. Mermaid Diagram Syntax Validation"
        run: |
          python scripts/ci/validate_mermaid.py

      - name: "4. Documentation Quality Regression Tests"
        run: |
          python -m unittest tests/docs/test_doc_validation.py
