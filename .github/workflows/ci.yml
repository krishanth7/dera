# ============================================================
# DERA — Database Engineering & Reverse Analysis
# Primary Continuous Integration & Pull Request Qualification
#
# Purpose:
#   Authoritative automated quality gate verifying Python backend,
#   TypeScript contracts/frontend, database integration,
#   architecture boundaries, and documentation quality.
#
# Security principles:
#   - Least-privilege permissions (contents: read)
#   - Safe concurrency with automated PR cancellation
#   - Job timeouts on all executions
#   - Zero external AI services / strictly deterministic
#   - Disposable ephemeral test databases
# ============================================================

name: "DERA CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----------------------------------------------------------
  # 1. Python Backend Quality, Linting, SAST & Testing
  # ----------------------------------------------------------
  python-qualification:
    name: "Python (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: "Install Build & Runtime Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings networkx sqlglot fastapi uvicorn httpx ruff bandit build setuptools sqlalchemy alembic asyncpg greenlet aiosqlite argon2-cffi celery redis
          pip install -e .

      - name: "Ruff Linting & Format Verification"
        run: |
          python -m ruff check packages/ apps/ tests/ scripts/
          python -m ruff format --check packages/ apps/ tests/ scripts/

      - name: "Compile Python Bytecode"
        run: |
          python -m compileall packages/ apps/ tests/ scripts/

      - name: "Static Application Security Testing (Bandit SAST)"
        run: |
          python -m bandit -r packages/core/src/ apps/api/src/ -ll -q

      - name: "Execute Unit, Architecture & Regression Test Suite"
        run: |
          python scripts/ci/test_reporter.py --test-dir tests/

      - name: "Generate Test Artifact Integrity Manifest"
        if: always()
        run: |
          if [ -d reports ]; then
            python scripts/ci/artifact_manager.py manifest reports/ --output reports/manifest.json
          fi

      - name: "Upload Test Execution Artifacts"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dera-test-results-linux-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: "Validate Distribution Build (sdist & wheel)"
        run: |
          python -m build --sdist --wheel
          python scripts/ci/artifact_manager.py manifest dist/ --output dist/manifest.json

      - name: "Upload Distribution Build Artifacts"
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dera-build-linux-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 14
          if-no-files-found: ignore

      - name: "Upload Failure Diagnostics"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dera-diagnostics-python-${{ matrix.python-version }}-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 5
          if-no-files-found: ignore

  # ----------------------------------------------------------
  # 2. Frontend & Monorepo Workspaces Qualification
  # ----------------------------------------------------------
  frontend-qualification:
    name: "Frontend & Monorepo Workspaces"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up Node.js LTS"
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: "Install Node Dependencies"
        run: |
          npm ci || npm install --no-audit

      - name: "Execute TypeScript Static Typecheck"
        run: |
          npm run typecheck

      - name: "Validate Workspace Package Builds"
        run: |
          npm run build

      - name: "Upload Frontend Failure Diagnostics"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dera-diagnostics-frontend-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            npm-debug.log*
          retention-days: 5
          if-no-files-found: ignore

  # ----------------------------------------------------------
  # 3. Canonical Schema Contracts & Architecture Boundaries
  # ----------------------------------------------------------
  contracts-architecture:
    name: "Contracts & Architecture Boundaries"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: "Install Core & Connector Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings networkx sqlglot fastapi uvicorn httpx sqlalchemy alembic asyncpg greenlet aiosqlite argon2-cffi celery redis
          pip install -e .

      - name: "Verify Schema Contract File Integrity"
        run: |
          test -s packages/core/src/dera/models.py
          test -s packages/contracts/src/index.ts

      - name: "Verify Module Boundaries & Zero-AI Policies"
        run: |
          python -m unittest tests/architecture/test_module_boundaries.py

      - name: "Validate OpenAPI Specification & Zero-Drift Governance"
        run: |
          python scripts/ci/validate_openapi.py --check

  # ----------------------------------------------------------
  # 4. Database Connector Integration & Ephemeral PostgreSQL 16
  # ----------------------------------------------------------
  database-integration:
    name: "Database Integration (SQLite & Ephemeral PostgreSQL 16)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dera_test_db
          POSTGRES_USER: dera_test_user
          POSTGRES_PASSWORD: dera_ephemeral_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: "Install Database & Platform Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings networkx sqlglot fastapi uvicorn httpx sqlalchemy alembic asyncpg greenlet aiosqlite argon2-cffi celery redis
          pip install -e .

      - name: "Verify PostgreSQL 16 & Redis Service Containers Readiness"
        run: |
          nc -z 127.0.0.1 5432 || (sleep 2 && nc -z 127.0.0.1 5432)
          nc -z 127.0.0.1 6379 || (sleep 2 && nc -z 127.0.0.1 6379)
          echo "PostgreSQL 16 and Redis service containers are healthy and ready for platform testing."

      - name: "Execute SQLite Connector Integration Suite"
        run: |
          python -m unittest tests/integration/test_sqlite_connector.py

      - name: "Apply Platform Database Migrations (PostgreSQL 16 Head)"
        env:
          DERA_PLATFORM_DATABASE_URL: "postgresql+asyncpg://dera_test_user:dera_ephemeral_test_password@127.0.0.1:5432/dera_test_db"
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: "Execute Platform Database & Migration Test Suite (PostgreSQL 16)"
        env:
          DERA_PLATFORM_DATABASE_URL: "postgresql+asyncpg://dera_test_user:dera_ephemeral_test_password@127.0.0.1:5432/dera_test_db"
        run: |
          python -m unittest discover -s tests/database -p "test_*.py"
          python -m unittest tests/integration/test_platform_database.py

      - name: "Verify Migration Reversibility (Downgrade & Re-Upgrade)"
        env:
          DERA_PLATFORM_DATABASE_URL: "postgresql+asyncpg://dera_test_user:dera_ephemeral_test_password@127.0.0.1:5432/dera_test_db"
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

  # ----------------------------------------------------------
  # 5. Full Documentation Quality & Navigation Gate
  # ----------------------------------------------------------
  documentation-quality:
    name: "Documentation Quality Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up Node.js LTS"
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: "Install Node Dependencies"
        run: |
          npm ci || npm install --no-audit

      - name: "Execute Hermetic Documentation Quality Verification"
        run: |
          npm run docs:check

  # ----------------------------------------------------------
  # 6. Master CI Qualification Gate (Branch Protection Target)
  # ----------------------------------------------------------
  ci-gate:
    name: "Qualification Gate"
    needs:
      - python-qualification
      - frontend-qualification
      - contracts-architecture
      - database-integration
      - documentation-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: "Generate Qualification Gate Summary"
        run: |
          echo "### DERA Continuous Integration Qualification Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Qualification Domain | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Matrix (3.12 & 3.13) | ${{ needs.python-qualification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend & Monorepo Workspaces | ${{ needs.frontend-qualification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contracts & Architecture Boundaries | ${{ needs.contracts-architecture.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Integration (SQLite & Postgres 16) | ${{ needs.database-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation Quality Gate | ${{ needs.documentation-quality.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.python-qualification.result }}" != "success" ] || \
             [ "${{ needs.frontend-qualification.result }}" != "success" ] || \
             [ "${{ needs.contracts-architecture.result }}" != "success" ] || \
             [ "${{ needs.database-integration.result }}" != "success" ] || \
             [ "${{ needs.documentation-quality.result }}" != "success" ]; then
            echo "CI Qualification Gate FAILED: One or more prerequisite jobs did not succeed."
            exit 1
          fi
          echo "CI Qualification Gate PASSED: All verification domains satisfied."
