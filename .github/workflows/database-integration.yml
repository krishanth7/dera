# ============================================================
# DERA — Database Engineering & Reverse Analysis
# Ephemeral Database Integration Testing
#
# Purpose:
#   Tests schema extraction, constraint resolution, and read-only
#   permission enforcement against ephemeral disposable databases.
# ============================================================

name: "DERA | Database Integration"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-integration:
    name: "SQLite Connector Integration"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up Python 3.13"
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: "Execute SQLite Integration Tests"
        env:
          PYTHONPATH: packages/core/src:apps/api/src
        run: |
          python -m unittest discover tests/integration/

  postgres-service:
    name: "PostgreSQL Ephemeral Integration Service"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dera_test_db
          POSTGRES_USER: dera_test_user
          POSTGRES_PASSWORD: dera_ephemeral_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Verify PostgreSQL Container Readiness"
        run: |
          # Verify container availability on localhost port 5432
          nc -z 127.0.0.1 5432 || (sleep 2 && nc -z 127.0.0.1 5432)
          echo "PostgreSQL 16 ephemeral container is healthy and ready for connector testing."
