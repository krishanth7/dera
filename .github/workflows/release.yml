# ============================================================
# DERA — Database Engineering & Reverse Analysis
# Enterprise Release Automation
#
# Purpose:
#   Controlled semantic release qualification, artifact packaging,
#   SHA-256 checksum generation, and GitHub release publication.
# ============================================================

name: "DERA | Release"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-and-build:
    name: "Qualify, Build & Package Artifacts"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "Checkout DERA Repository"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Run Pre-Release Test Gate"
        env:
          PYTHONPATH: packages/core/src:apps/api/src
        run: |
          pip install pydantic networkx sqlglot build
          python -m unittest discover tests/

      - name: "Build Python Core Wheel & Sdist"
        run: |
          python -m build

      - name: "Build TypeScript Monorepo Artifacts"
        run: |
          npm ci || npm install --no-audit
          npx tsc --noEmit
          npm pack --workspace=packages/contracts --pack-destination=dist/

      - name: "Generate SHA-256 Checksums"
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: "Upload Release Artifacts to Workflow Run"
        uses: actions/upload-artifact@v4
        with:
          name: dera-release-artifacts
          path: dist/
          retention-days: 30

      - name: "Publish GitHub Release"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name || inputs.version_tag }}
        run: |
          gh release create "${TAG_NAME}" dist/* \
            --title "DERA ${TAG_NAME}" \
            --generate-notes \
            --verify-tag || echo "Release creation completed or already exists."
