# DERA — Authoritative Alembic Migration Configuration
# For DERA Platform Database (PostgreSQL 16+)
# Deterministic, environment-driven configuration without committed credentials.

[alembic]
# Path to migration environment scripts
script_location = migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path prepends
prepend_sys_path = apps/api/src:packages/core/src:.

# Timezone for revision generation timestamps
timezone = UTC

# Truncate slug to 40 characters
truncate_slug_length = 40

# Max length of characters for revision IDs
version_locations = migrations/versions

# Output encoding
output_encoding = utf-8

# sqlalchemy.url is intentionally left unset here.
# Connection URL is dynamically injected from DERA_PLATFORM_DATABASE_URL
# or dera_api.core.config.ApiSettings in migrations/env.py.

[post_write_hooks]
# Post-write hooks for formatting generated migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
