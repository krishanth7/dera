[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dera-core"
version = "0.1.0.dev1"
description = "Deterministic database reverse engineering and schema analysis platform"
readme = "README.md"
authors = [{ name = "Bunga Krishanth", email = "krishanth.b.2008@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "sqlglot>=20.0.0",
    "fastapi>=0.110.0",
]

[project.urls]
Homepage = "https://github.com/krishanth7/dera"
Repository = "https://github.com/krishanth7/dera"

[tool.setuptools.packages.find]
where = ["packages/core/src", "apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core/src", "apps/api/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
